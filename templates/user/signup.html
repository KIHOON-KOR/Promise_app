{% extends 'base.html' %}

{% block title %}회원가입 - 약속잡이{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 450px; border-radius: 1rem;">
        <div class="card-body p-5">
            <h3 class="fw-bold text-center mb-4" style="color: var(--brand-primary);">약속잡이 계정 만들기</h3>

            <form id="signupForm">
                <div class="mb-3">
                    <label for="username" class="form-label text-muted small fw-bold">아이디</label>
                    <input type="text" class="form-control form-control-lg" id="username" placeholder="사용할 아이디를 입력해주세요" required>
                </div>

                <div class="mb-3">
                    <label for="nickname" class="form-label text-muted small fw-bold">닉네임</label>
                    <input type="text" class="form-control form-control-lg" id="nickname" placeholder="닉네임일 입력해주세요" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-muted small fw-bold">비밀번호</label>
                    <input type="password" class="form-control form-control-lg" id="password" placeholder="비밀번호 (8자 이상)" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3" style="border-radius: 0.5rem;">
                    가입 완료하기
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted small">이미 계정이 있으신가요? </span>
                <a href="/api/v1/user/login-page/" class="text-decoration-none fw-bold" style="color: var(--brand-primary);">로그인</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 회원가입 폼 요소에 폼 제출 이벤트가 발생하면 실행될 비동기 함수를 연결합니다.
    document.getElementById('signupForm').addEventListener('submit', async function (e) {
        // 화면이 깜빡이며 새로고침되는 브라우저의 폼 기본 동작을 차단합니다.
        e.preventDefault();

        // 아이디 입력칸의 텍스트 값을 자바스크립트 변수로 가져옵니다.
        const username = document.getElementById('username').value;
        // 닉네임 입력칸의 텍스트 값을 자바스크립트 변수로 가져옵니다.
        const nickname = document.getElementById('nickname').value;
        // 비밀번호 입력칸의 텍스트 값을 자바스크립트 변수로 가져옵니다.
        const password = document.getElementById('password').value;
        // 중복 제출을 막기 위해 가입 버튼 요소를 찾아옵니다.
        const submitBtn = this.querySelector('button[type="submit"]');

        // 진행 중임을 알리기 위해 버튼의 텍스트를 바꿉니다.
        submitBtn.innerText = '가입 처리 중...';
        // 버튼을 누를 수 없도록 비활성화 상태로 만듭니다.
        submitBtn.disabled = true;

        // 통신 중 발생할 수 있는 에러를 안전하게 잡기 위해 예외 처리 블록을 엽니다.
        try {
            // 장고 백엔드의 회원가입 데이터 처리 주소로 비동기 요청을 보냅니다.
            const response = await fetch('/api/v1/user/signup/', {
                // 새로운 데이터를 서버에 생성하므로 POST 방식을 사용합니다.
                method: 'POST',
                // 우리가 보내는 데이터가 JSON 규칙을 따른다고 서버에 알립니다.
                headers: { 'Content-Type': 'application/json' },
                // 수집한 세 가지 데이터를 자바스크립트 객체로 묶어 문자열로 변환한 뒤 전송합니다.
                body: JSON.stringify({ username: username, nickname: nickname, password: password })
            // fetch 요청의 괄호를 닫습니다.
            });

            // 서버에서 돌아온 응답 데이터를 다시 자바스크립트 객체로 변환하여 읽습니다.
            const data = await response.json();

            // 백엔드에서 에러 없이 성공적인 결과(200번대 응답)를 주었는지 확인합니다.
            if (response.ok) {
                // 성공 메시지를 띄워 사용자에게 알립니다.
                alert("회원가입이 완료되었습니다! 로그인해주세요.");
                // 곧바로 로그인 페이지로 화면을 이동시켜 줍니다.
                window.location.href = "/api/v1/user/login-page/";
            // 중복된 아이디 등 백엔드에서 가입 거절(400번대 응답)을 한 경우입니다.
            } else {
                // 서버가 보내준 구체적인 거절 사유를 팝업으로 띄워줍니다.
                alert(data.message || "회원가입에 실패했습니다.");
                // 사용자가 다시 시도할 수 있도록 버튼 텍스트를 원래대로 돌려놓습니다.
                submitBtn.innerText = '가입 완료하기';
                // 버튼의 비활성화 상태를 풀어줍니다.
                submitBtn.disabled = false;
            // 조건문의 끝입니다.
            }
        // 인터넷이 끊겼거나 서버가 꺼진 최악의 경우를 처리하는 블록입니다.
        } catch (error) {
            // 알림창으로 서버와의 연결 문제를 알립니다.
            alert("서버와 통신할 수 없습니다.");
            // 다시 시도할 수 있도록 버튼을 원상 복구합니다.
            submitBtn.innerText = '가입 완료하기';
            // 버튼의 비활성화 상태를 풀어줍니다.
            submitBtn.disabled = false;
        // 예외 처리 블록을 닫습니다.
        }
    // 이벤트 리스너 연결을 마칩니다.
    });
// 자바스크립트 코드를 닫습니다.
</script>
{% endblock %}
