{% extends 'base.html' %}

{% block title %}멤버 관리 - 약속잡이{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-4 mb-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body">
                <h5 class="fw-bold mb-3"><i class="bi bi-person-plus me-2"></i>멤버 초대</h5>
                <p class="text-muted small">초대할 유저의 ID를 입력하세요.</p>

                <div class="input-group">
                    <input type="number" id="targetUserId" class="form-control" placeholder="유저 ID">
                    <button class="btn btn-primary" onclick="handleInvite()">초대</button>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="fw-bold mb-0">현재 참여 멤버</h5>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>유저 ID</th>
                            <th>상태</th>
                            <th class="text-end">관리</th>
                        </tr>
                    </thead>
                    <tbody id="memberList">
                        <tr>
                            <td>12</td>
                            <td><span class="badge bg-info">일반 멤버</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-success me-1" onclick="handleGrant(12)">권한 부여</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="handleKick(12)">강퇴</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 현재 URL에서 약속 ID를 추출합니다 (예: /event/5/manage-page/ 에서 5를 추출)
    const pathSegments = window.location.pathname.split('/');
    const eventId = pathSegments[pathSegments.length - 3];
    const token = localStorage.getItem('access_token');

    // 1. 멤버 초대 기능
    async function handleInvite() {
        const targetId = document.getElementById('targetUserId').value;
        if (!targetId) return alert("ID를 입력해주세요.");

        const response = await fetch(`/api/v1/event/${eventId}/invite/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ target_user_id: targetId })
        });

        if (response.ok) alert("성공적으로 초대했습니다!");
        else alert("초대 권한이 없거나 이미 참여 중인 멤버입니다.");
    }

    // 2. 초대 권한 부여 기능
    async function handleGrant(targetId) {
        if (!confirm("이 멤버에게 초대 권한을 부여하시겠습니까?")) return;

        const response = await fetch(`/api/v1/event/${eventId}/grant/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ target_user_id: targetId })
        });

        if (response.ok) alert("초대 권한을 부여했습니다.");
        else alert("방장만 권한을 부여할 수 있습니다.");
    }

    // 3. 멤버 강퇴 기능
    async function handleKick(targetId) {
        if (!confirm("정말 이 멤버를 강퇴하시겠습니까?")) return;

        const response = await fetch(`/api/v1/event/${eventId}/kick/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ target_user_id: targetId })
        });

        if (response.status === 204) {
            alert("멤버를 강퇴했습니다.");
            location.reload(); // 목록 갱신을 위해 새로고침
        } else {
            alert("강퇴 권한이 없습니다.");
        }
    }
</script>
{% endblock %}
