{% extends 'base.html' %}

{% block title %}약속 상세정보 - 약속잡이{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-5">
                <h3 id="detailTitle" class="fw-bold mb-4">로딩 중...</h3>
                
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item px-0 py-3">
                        <span class="text-muted small d-block mb-1">모임 성격</span>
                        <strong id="detailType">-</strong>
                    </li>
                    <li class="list-group-item px-0 py-3">
                        <span class="text-muted small d-block mb-1">생성 일자</span>
                        <strong id="detailDate">-</strong>
                    </li>
                </ul>

                <div class="d-flex gap-2">
                    <button id="manageBtn" class="btn btn-primary flex-grow-1 fw-bold">멤버 관리하기</button>
                    <a href="/api/v1/event/list-page/" class="btn btn-outline-secondary flex-grow-1 fw-bold">목록으로</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 현재 인터넷 주소창의 텍스트를 슬래시 기호로 잘라 배열로 만듭니다.
    const pathSegments = window.location.pathname.split('/');
    // 주소창 규칙상 뒤에서 3번째에 있는 숫자가 약속 고유 번호(ID)이므로 이를 추출합니다.
    const eventId = pathSegments[pathSegments.length - 3];
    // 내 컴퓨터에 저장된 로그인 출입증을 꺼내옵니다.
    const token = localStorage.getItem('access_token');

    // 화면이 그려진 직후 바로 데이터를 불러오도록 이벤트를 연결합니다.
    document.addEventListener("DOMContentLoaded", async function() {
        try {
            // 단일 약속 조회 API 주소로 출입증과 함께 요청을 보냅니다.
            const response = await fetch(`/api/v1/event/${eventId}/`, {
                // 데이터를 조회하기만 하므로 GET 방식입니다.
                method: 'GET',
                // 헤더에 증명서를 넣습니다.
                headers: { 'Authorization': 'Bearer ' + token }
            // fetch를 닫습니다.
            });

            // 서버 응답이 성공적이라면
            if (response.ok) {
                // 응답 데이터를 자바스크립트 객체로 풀어냅니다.
                const eventData = await response.json();
                
                // 화면의 제목 자리에 찾아온 약속의 제목을 덮어씁니다.
                document.getElementById('detailTitle').innerText = eventData.title;
                // 비즈니스 여부에 따라 적절한 단어를 화면에 표시합니다.
                document.getElementById('detailType').innerText = eventData.is_business ? '비즈니스 모임' : '일반 친목 모임';
                // 날짜 데이터를 읽기 편한 형식으로 바꾸어 화면에 넣습니다.
                document.getElementById('detailDate').innerText = new Date(eventData.created_at).toLocaleDateString();
                
                // 멤버 관리 버튼을 눌렀을 때 해당 약속의 관리 페이지로 이동하도록 동작을 설정합니다.
                document.getElementById('manageBtn').onclick = function() {
                    // 인터넷 주소를 관리 페이지 주소로 강제로 변경합니다.
                    window.location.href = `/api/v1/event/${eventId}/manage-page/`;
                // 버튼 동작 설정을 닫습니다.
                };
            // 권한이 없거나 없는 약속 번호일 경우
            } else {
                // 사용자에게 경고창을 띄웁니다.
                alert("약속 정보를 불러올 수 없습니다.");
                // 강제로 목록 페이지로 쫓아냅니다.
                window.location.href = "/api/v1/event/list-page/";
            // 조건문을 닫습니다.
            }
        // 에러를 잡습니다.
        } catch (error) {
            // 통신 에러 창을 띄웁니다.
            alert("서버와 통신할 수 없습니다.");
        // 예외 처리를 닫습니다.
        }
    // 이벤트 연결을 닫습니다.
    });
</script>
{% endblock %}
