{% extends 'base.html' %}

{% block title %}내 약속 목록 - 약속잡이{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-8">
        <h3 class="fw-bold mb-4">내 약속 목록</h3>
        
        <div id="eventListContainer" class="row g-3">
            <div class="text-center text-muted py-5">목록을 불러오는 중입니다...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // HTML 문서가 브라우저에 모두 그려진 직후에 내부 함수를 실행하도록 약속합니다.
    document.addEventListener("DOMContentLoaded", async function() {
        // 브라우저의 개인 저장소에서 로그인할 때 발급받은 출입증(토큰)을 꺼내옵니다.
        const token = localStorage.getItem('access_token');
        // 카드가 그려질 공간인 컨테이너 요소를 HTML에서 찾아옵니다.
        const container = document.getElementById('eventListContainer');

        // 통신 중 발생할 수 있는 오류를 안전하게 처리하기 위해 예외 처리 구문을 엽니다.
        try {
            // 백엔드의 전체 목록 조회 주소로 데이터를 요청하며, 완료될 때까지 기다립니다(await).
            const response = await fetch('/api/v1/event/list/', {
                // 데이터를 단순히 가져오는 것이므로 GET 방식을 지정합니다.
                method: 'GET',
                // 내가 정당한 회원임을 증명하기 위해 헤더에 출입증을 첨부합니다.
                headers: { 'Authorization': 'Bearer ' + token }
            // fetch 요청을 닫습니다.
            });

            // 서버에서 돌아온 응답 데이터를 자바스크립트가 읽을 수 있는 객체 배열로 변환합니다.
            const events = await response.json();

            // 컨테이너 안에 있던 로딩 문구를 깨끗하게 지워줍니다.
            container.innerHTML = '';

            // 받아온 약속 데이터가 하나도 없다면 (배열의 길이가 0이라면)
            if (events.length === 0) {
                // 사용자가 이해하기 쉽도록 안내 문구를 컨테이너에 넣어줍니다.
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">참여 중인 약속이 없습니다. 새로운 약속을 만들어보세요!</div>';
                // 함수 실행을 여기서 마치고 되돌아갑니다.
                return;
            // 조건문을 닫습니다.
            }

            // 약속 데이터가 들어있는 배열을 하나씩 꺼내며 반복 작업을 수행합니다.
            events.forEach(function(event) {
                // 비즈니스 약속인지 확인하여 화면에 보여줄 꼬리표(뱃지) 글자를 정합니다.
                const badgeText = event.is_business ? '비즈니스' : '일반 친목';
                // 비즈니스 여부에 따라 꼬리표의 색상을 파란색(primary) 또는 회색(secondary)으로 정합니다.
                const badgeClass = event.is_business ? 'bg-primary' : 'bg-secondary';
                // 서버에서 준 날짜 데이터를 화면에 예쁘게 보일 수 있는 지역 시간 텍스트로 바꿉니다.
                const dateText = new Date(event.created_at).toLocaleDateString();

                // 백틱 기호를 사용하여 하나의 약속을 나타내는 HTML 카드 디자인을 문자열로 만듭니다.
                const cardHtml = `
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 rounded-4 h-100 cursor-pointer" onclick="location.href='/api/v1/event/${event.id}/detail-page/'" style="cursor: pointer; transition: transform 0.2s;">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge ${badgeClass}">${badgeText}</span>
                                    <small class="text-muted">${dateText}</small>
                                </div>
                                <h5 class="fw-bold mb-3">${event.title}</h5>
                                <div class="text-muted small">
                                    <i class="bi bi-person-badge me-1"></i> 방장: ${event.host_name}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                // 완성된 카드 문구를 컨테이너의 기존 내용물 뒤에 이어붙여 화면에 나타나게 합니다.
                container.insertAdjacentHTML('beforeend', cardHtml);
            // 반복문을 닫습니다.
            });

        // 통신 실패 등 오류가 났을 때 실행될 구역입니다.
        } catch (error) {
            // 사용자에게 오류가 발생했음을 화면에 띄워 알립니다.
            container.innerHTML = '<div class="col-12 text-center text-danger py-5">목록을 불러오는 중 오류가 발생했습니다.</div>';
        // 예외 처리 구문을 닫습니다.
        }
    // 이벤트 연결을 마칩니다.
    });
// 자바스크립트 태그를 닫습니다.
</script>
{% endblock %}
